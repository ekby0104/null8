name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/webcam-fx-restructure-e9s0id]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild가 mediapipe wasm을 node_modules → public/으로 복사한다
      - run: npm run build

      # dist/를 gh-pages 브랜치로 푸시 — 브랜치 생성 시 Pages가 활성화된다
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
